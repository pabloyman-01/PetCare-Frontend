  <circle cx="21" cy="15" r="2.2" fill="#fff"/>
  <circle cx="12" cy="14.5" r="1" fill="#1a1a1a"/>
  <circle cx="22" cy="14.5" r="1" fill="#1a1a1a"/>
  <!-- Nose -->
