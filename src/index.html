<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>PetCare - Gestión Veterinaria</title>
  <base href="/PetCare-Frontend/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4FC3F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PetCare" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" rel="stylesheet" />
  <script>
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        var base = '/PetCare-Frontend/';
        var path = redirect.substring(redirect.indexOf(base) + base.length - 1);
        if (path && path !== '/') {
          history.replaceState(null, '', base + path.substring(1));
        }
      }
    })();
  </script>
</head>
<body class="bg-surface text-on-surface font-sans antialiased">
  <app-root></app-root>
</body>
</html>
